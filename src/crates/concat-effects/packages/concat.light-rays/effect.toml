format = 2

[effect]
id = "concat.light-rays"
name = "Light Rays"
kind = "effect"
category = "Elements"
order = 64
intensity = "amount"
description = "Shafts of light falling from above, slowly shimmering: sun through clouds, light under the sea, a lamp in dust."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "angle"
label = "Angle"
min = -45
max = 45
default = -15
step = 1
unit = "°"

[[param]]
key = "speed"
label = "Shimmer"
min = 0
max = 200
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
