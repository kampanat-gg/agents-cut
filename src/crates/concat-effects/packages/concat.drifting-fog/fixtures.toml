# Colours in the working space: linear light. At its least the element
# draws nothing, so the picture passes through untouched.

[[probe]]
name = "minimum"
at = "min"
input = [0.3, 0.2, 0.12, 1]
expect = [0.3, 0.2, 0.12, 1]

[[probe]]
name = "default"
input = [0.3, 0.2, 0.12, 1]
expect = [0.30737, 0.20898, 0.13049, 1]

[[probe]]
name = "maximum"
at = "max"
input = [0.3, 0.2, 0.12, 1]
expect = [0.48096, 0.42041, 0.37671, 1]
