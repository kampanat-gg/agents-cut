format = 2

[effect]
id = "concat.bubbles"
name = "Bubbles"
kind = "effect"
category = "Elements"
order = 63
intensity = "amount"
description = "Bubbles rising through the picture, with a bright rim and a highlight. For underwater scenes, drinks, dreams."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "size"
label = "Size"
min = 10
max = 100
default = 40
step = 1
unit = "%"

[[param]]
key = "speed"
label = "Speed"
min = 10
max = 200
default = 100
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
