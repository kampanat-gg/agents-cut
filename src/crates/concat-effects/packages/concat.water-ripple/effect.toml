format = 2

[effect]
id = "concat.water-ripple"
name = "Water Ripple"
kind = "effect"
category = "Elements"
order = 65
intensity = "strength"
description = "Makes still water move: the picture below a horizon line ripples and sways in slow waves. Put it on a picture of the sea, a lake or a river."

[[param]]
key = "strength"
label = "Strength"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[[param]]
key = "scale"
label = "Wave size"
min = 10
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "speed"
label = "Speed"
min = 10
max = 200
default = 100
step = 1
unit = "%"

[[param]]
key = "horizon"
label = "Horizon"
min = 0
max = 100
default = 45
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
