format = 2

[effect]
id = "concat.snowfall"
name = "Snowfall"
kind = "effect"
category = "Elements"
order = 61
intensity = "amount"
description = "Snow drifting down over the picture, soft flakes in three depths that sway in the wind. Put it on an effect layer above a scene."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "size"
label = "Flake size"
min = 10
max = 100
default = 40
step = 1
unit = "%"

[[param]]
key = "speed"
label = "Speed"
min = 10
max = 200
default = 100
step = 1
unit = "%"

[[param]]
key = "wind"
label = "Wind"
min = -100
max = 100
default = 20
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
